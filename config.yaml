# Trading bot config. PAPER ONLY - there is no live order code in this version.
mode: paper

exchange:
  base_url: https://revx.revolut.com/api/1.0
  region: EEA
  pairs: [BTC-USD, ETH-USD, SOL-USD, XRP-USD, ADA-USD, DOGE-USD, LINK-USD, AVAX-USD,
          DOT-USD, LTC-USD, BNB-USD, TRX-USD, SUI-USD]
  # Most alts are thin on Revolut X (<$150k/day): real fills would be worse than paper.
  min_volume_usd_24h: 100000  # skip coins too thin to trade for real (checked every scan)
  fee_rate: 0.0009         # Revolut X taker fee, charged on BOTH sides (maker is 0%, but paper can't model limit fills honestly)

account:
  starting_equity: 200     # paper USD, per strategy

# Shared risk rules. Strategies may override min_reward_risk, position_pct, max_drawdown_kill.
risk:
  risk_per_trade: 0.01     # 1% of that strategy's equity lost if the stop hits
  min_reward_risk: 2.0     # after fees
  max_open_positions: 2    # per strategy
  max_position_pct: 0.30   # max 30% of equity in one coin
  daily_loss_halt: 0.03    # -3% in a day -> that strategy pauses until tomorrow (UTC)
  max_drawdown_kill: 0.10  # -10% from peak -> kill switch for that strategy, /resetkill to resume

# Six strategies compete, each with its own $200 paper account.
strategies:
  trend_daily:             # long-term trend filter: hold BTC/ETH while above the 200-day average
    type: regime
    interval_min: 1440
    pairs: [BTC-USD, ETH-USD]
    sma: 200
    position_pct: 0.5      # half the account per coin, no 1%-risk sizing
    stop_pct: 0.20         # disaster stop only; normal exit = daily close below the average
    max_drawdown_kill: 0.35  # crypto swings 30%+ inside a trend; 10% would kill it constantly
    llm_review: false

  trend_4h:                # baseline: buy dips in an uptrend, rarely trades
    type: trend
    interval_min: 240
    ema_fast: 50
    ema_slow: 200
    rsi_min: 35
    rsi_max: 50
    stop_atr_mult: 1.5
    target_atr_mult: 3.5   # 3.0 = exactly 2:1 before fees, which always fails the 2:1 rule
    llm_review: true

  trend_1h:                # same idea on hourly candles
    type: trend
    interval_min: 60
    ema_fast: 50
    ema_slow: 200
    rsi_min: 35
    rsi_max: 50
    stop_atr_mult: 1.5
    target_atr_mult: 3.5
    min_reward_risk: 1.5   # fees eat more on small moves; 2.0 would block almost every trade
    llm_review: true

  trend_1h_be:             # identical to trend_1h, plus: halfway to target -> stop moves to buy price
    type: trend
    interval_min: 60
    ema_fast: 50
    ema_slow: 200
    rsi_min: 35
    rsi_max: 50
    stop_atr_mult: 1.5
    target_atr_mult: 3.5
    min_reward_risk: 1.5
    breakeven_at: 0.5      # fraction of the way to the target
    llm_review: false      # no news veto, so it can't differ from trend_1h for that reason

  bounce_1h:               # buys sharp drops (works in downtrends) - most likely to lose
    type: bounce
    interval_min: 60
    rsi_max: 30            # oversold
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    min_reward_risk: 1.3
    llm_review: false

  scalp_15m:               # Socratis' idea: quick dip trades, short hold, cooldown
    type: trend
    interval_min: 15
    ema_fast: 20
    ema_slow: 50
    rsi_min: 35
    rsi_max: 50
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    min_reward_risk: 1.0   # only volatile coins can pass anything higher after fees
    max_hold_min: 20       # sell at market after 20 min
    cooldown_min: 90       # no new trade on the same coin for 90 min after an exit
    llm_review: false

indicators:
  rsi_period: 14
  atr_period: 14

schedule:
  monitor_every_sec: 30    # stop / target / time-exit checks on open positions

go_live:                   # shown in the Sunday report; all must pass before any real money
  min_trades: 30
  max_drawdown: 0.15

report:                    # weekly Telegram report = heartbeat. No report on Sunday = bot is down.
  weekday: 6               # 0=Mon ... 6=Sun
  hour: 18
  timezone: Asia/Nicosia

approval:
  required: false          # paper: auto-approve so results aren't skewed by sleep. Set true before real money.
  expiry_min: 15

llm:
  enabled: true            # only used by strategies with llm_review: true
  model: haiku
  timeout_sec: 120

news:
  feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
  max_items: 15

data_dir: /data
