services:
  trading-bot:
    image: ghcr.io/socratisp/trading-bot:latest
    container_name: trading-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - bot-data:/data
      - claude-auth:/home/bot/.claude
    # Keeps the bot from starving Umami on the same server.
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
  claude-auth:
